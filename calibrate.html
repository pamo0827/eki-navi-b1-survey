<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>下絵の位置合わせ</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="calibrate.css">
</head>
<body class="calibrate">
  <!-- 上: 位置の分かっている画像（国交省のデータから作った画像）。下: 合わせたい下絵（JR の構内図など） -->
  <!-- 同じ場所を、上 → 下 の順に押すと1組。3組以上で、下絵のピクセル → 共通座標の変換を求める -->
  <div class="panes">
    <section class="pane">
      <svg id="ref" class="pane-map" role="img" aria-label="位置の分かっている画像"></svg>
      <span class="pane-tag">基準</span>
    </section>
    <section class="pane">
      <svg id="target" class="pane-map" role="img" aria-label="合わせたい下絵"></svg>
      <span class="pane-tag">下絵</span>
      <label class="round ghost pane-open" aria-label="下絵の画像を開く">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="icon"><path d="M12 15V4M7 9l5-5 5 5M5 19h14"></path></svg>
        <input id="target-file" type="file" accept="image/png,image/jpeg" class="visually-hidden">
      </label>
    </section>
  </div>
  <aside class="panel">
    <p id="hint" class="hint-line"></p>
    <ol id="pairs" class="pairs"></ol>
    <p id="fit" class="fit-line"></p>
    <div class="row">
      <label class="check"><input id="overlay" type="checkbox"> 基準を下絵に重ねる</label>
      <button type="button" id="undo" class="pill ghost">1組消す</button>
      <button type="button" id="save" class="pill primary" disabled>config.json を保存</button>
    </div>
  </aside>
  <script src="geo.js"></script>
  <script src="calibrate.js"></script>
</body>
</html>
